[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "trace-to-golden"
version = "0.2.0"
description = "Turn production LLM traces (OpenTelemetry GenAI, MLflow) into reviewed, PII-free golden eval cases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Adel Saoud" }]
keywords = ["llm", "evaluation", "opentelemetry", "golden-dataset", "pii", "mlflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "typer>=0.15",
    "rich>=14.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "spacy>=3.8",
]

[project.urls]
Homepage = "https://github.com/adel-saoud/trace-to-golden"
Repository = "https://github.com/adel-saoud/trace-to-golden"
Issues = "https://github.com/adel-saoud/trace-to-golden/issues"

[project.scripts]
ttg = "trace_to_golden.cli:app"

[dependency-groups]
# The spaCy models are not on PyPI, so they live in a dev group (never in published
# metadata) and are pulled from the spaCy release page by uv.
dev = [
    "en-core-web-sm",
    "fr-core-news-md",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17.2",
    "pyright==1.1.414",
    "pre-commit>=4.0",
    "commitizen>=4.19.3",
    "jsonschema>=4.26.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "N", "ANN", "S", "PT", "TID", "PL", "TRY"]
ignore = [
    "PLR0913", # typer command handlers take one argument per CLI option
    "PLR0917", # same, positional because typer reads the signature
    "PLR0911", # format decoders return early per input shape
    "PLR2004", # magic value comparisons read fine in context
    "PLC0415", # local imports keep the CLI fast to start
    "TRY003",  # long exception messages are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004", "S101", "S105", "S106", "S311"]
"scripts/**/*.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=trace_to_golden",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = false
major_version_zero = true
